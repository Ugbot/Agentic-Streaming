# Compose umbrella for the bond/crypto markets streaming scenarios that go through Kafka
# instead of in-JVM ZeroMQ: the CryptoMarketAgentExample and BondMarketAgentExample mains submitted
# via `flink run`.
#
# Brings up:
#   - Kafka (broker + ZooKeeper; topics auto-created on first produce)
#   - Flink session cluster (so submitted market jobs land somewhere)
#
# Bring up:
#   docker network create agentic-flink-network    # once
#   docker compose -f docker-compose-markets.yml up -d
#
# Then, from the repository root:
#   java -cp target/agentic-flink-1.0.0-SNAPSHOT-uber.jar \
#       org.agentic.flink.example.markets.producer.CoinbaseProducer --products BTC-USD,ETH-USD,SOL-USD
#   flink run -c org.agentic.flink.example.markets.CryptoMarketAgentExample \
#       target/agentic-flink-1.0.0-SNAPSHOT-uber.jar

include:
  - docker-compose-kafka.yml
  - docker-compose-session.yml
