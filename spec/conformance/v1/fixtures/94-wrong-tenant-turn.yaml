id: wrong-tenant-turn
description: 'A conversation belongs to the tenant that started it. A turn from another tenant is refused with nothing appended, even when the key collides.'
requires: [principal, tools, rule_brain]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router: {kind: static, default: main}
    paths:
      main:
        brain: rule
        tools: [pay]
        tool_triggers: {pay: pay}
    verifier: {kind: none}
  tools:
  - {id: pay, kind: counting, effect: idempotent}
turns:
- {conversation_id: c1, turn_id: t1, text: pay it, principal: {subject: alice, tenant: acme}}
- {conversation_id: c1, turn_id: t2, text: pay it, principal: {subject: bob, tenant: beta}}
- {conversation_id: c1, turn_id: t3, text: pay it, user_id: bob}
expect:
- {turn_id: t1, status: completed}
- {turn_id: t2, status: failed, error_class: policy, tool_calls: [], events: []}
- {turn_id: t3, status: failed, error_class: policy, tool_calls: [], events: []}
