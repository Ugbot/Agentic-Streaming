id: refusal-survives-a-crash
description: 'A crash around a refusal changes nothing: the redelivery refuses again, once, and no tool ever runs.'
requires: [tool_policy, crash_recovery, rule_brain, tools]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: a
    router: {kind: static, default: main}
    paths:
      main:
        brain: rule
        tools: []
        tool_triggers: {go: pay}
    verifier: {kind: none}
  tools:
  - {id: pay, kind: counting, effect: idempotent}
turns:
- conversation_id: c1
  turn_id: t1
  text: go
  crash_at: {event: tool_refused, when: after}
- {conversation_id: c1, turn_id: t1, text: go}
expect:
- {turn_id: t1, status: crashed}
- turn_id: t1
  status: failed
  error_class: policy
  tool_calls: []
