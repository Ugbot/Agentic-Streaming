id: signal-while-running
description: A signal for a turn that crashed before it suspended is refused, whether the log kept the partial turn
  or lost it. Redelivery reaches the suspension, and the signal then resumes it.
requires: [crash_recovery, effect_journal, tools, idempotency, suspend_resume]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router:
      kind: keyword
      default: main
      rules:
        main: [pay, refund, hello]
    paths:
      main:
        brain: rule
        prompt: You move money.
        tool_triggers: {pay: pay}
        x-suspend-until: approval
    verifier: {kind: none}
  tools:
  - {id: pay, kind: counting, effect: idempotent, x-count-by: keys}
turns:
- conversation_id: c1
  turn_id: t1
  text: pay the invoice
  crash_at: {event: routed, when: after}
- conversation_id: c1
  turn_id: t1
  signal: {kind: approval}
- {conversation_id: c1, turn_id: t1, text: pay the invoice}
- conversation_id: c1
  turn_id: t1
  signal: {kind: approval}
expect:
- {turn_id: t1, status: crashed}
- turn_id: t1
  status: failed
  error_class: validation
  events: []
- turn_id: t1
  status: suspended
  events: [turn_received, routed, turn_suspended]
- {turn_id: t1, status: completed, reply: '[main] pay returned 1'}
