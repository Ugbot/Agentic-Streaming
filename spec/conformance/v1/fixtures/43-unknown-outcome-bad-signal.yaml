id: unknown-outcome-bad-signal
description: 'A signal that does not answer the question is refused: nothing is appended, the turn stays suspended, and a good signal still resolves it.'
requires: [crash_recovery, effect_journal, tools, idempotency, suspend_resume]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router:
      kind: keyword
      default: main
      rules:
        main: [pay, refund, hello]
    paths:
      main:
        brain: rule
        prompt: You move money.
        tool_triggers: {pay: pay}
        tools: [pay]
    verifier: {kind: none}
  tools:
  - {id: pay, kind: counting, effect: non_idempotent}
  policies:
    approvers: {roles: [approver]}
turns:
- conversation_id: c1
  turn_id: t1
  text: pay the invoice
  crash_at: {call: pay, when: during}
- {conversation_id: c1, turn_id: t1, text: pay the invoice}
- conversation_id: c1
  turn_id: t1
  signal: {kind: approval, approved: true}
  principal: {subject: ops, roles: [approver]}
- conversation_id: c1
  turn_id: t1
  signal: {resolution: applied, result: ok}
  principal: {subject: ops, roles: [approver]}
expect:
- {turn_id: t1, status: crashed}
- {turn_id: t1, status: suspended}
- turn_id: t1
  status: failed
  error_class: validation
  events: []
- {turn_id: t1, status: completed, reply: '[main] pay returned ok'}
