id: saga-resumes-compensation
description: 'A saga that crashed while compensating carries on backward from the log: the recorded failure is not repeated, and the undo runs once under its key.'
requires: [crash_recovery, effect_journal, tools, idempotency, saga]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router:
      kind: keyword
      default: main
      rules:
        main: [pay, refund, hello]
    paths:
      main: {brain: rule, prompt: You move money., tools: [a, undo_a, b]}
    verifier: {kind: none}
  tools:
  - {id: a, kind: counting, x-count-by: keys, compensation: undo_a}
  - {id: b, kind: failing, effect: idempotent}
  - {id: undo_a, kind: counting, effect: idempotent, x-count-by: keys}
  saga:
    steps:
    - {name: a, tool: a}
    - {name: b, tool: b}
turns:
- conversation_id: c-started
  turn_id: t1
  text: pay the invoice
  crash_at: {event: compensation_started, when: after}
- {conversation_id: c-started, turn_id: t1, text: pay the invoice}
- conversation_id: c-undo
  turn_id: t1
  text: pay the invoice
  crash_at: {call: undo_a, when: during}
- {conversation_id: c-undo, turn_id: t1, text: pay the invoice}
expect:
- {turn_id: t1, status: crashed}
- turn_id: t1
  status: failed
  error_class: tool
  events: [turn_received, routed, tool_intent, tool_called, tool_intent, tool_failed, compensation_started, tool_intent, compensation_step, compensation_completed, turn_failed]
  tool_calls:
  - {tool: a, index: 0, result: 1}
  - {tool: b, index: 1, failed: true}
  - {tool: undo_a, index: 2, result: 1}
- {turn_id: t1, status: crashed}
- turn_id: t1
  status: failed
  error_class: tool
  events: [turn_received, routed, tool_intent, tool_called, tool_intent, tool_failed, compensation_started, tool_intent, compensation_step, compensation_completed, turn_failed]
  tool_calls:
  - {tool: a, index: 0, result: 1}
  - {tool: b, index: 1, failed: true}
  - {tool: undo_a, index: 2, result: 1}
