id: missing-turn-id
description: A turn without a turn_id is refused and appends nothing. It cannot be deduplicated, so no id is invented
  for it.
requires: [idempotency]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router:
      kind: keyword
      default: main
      rules:
        main: [pay, refund, hello]
    paths:
      main:
        brain: rule
        prompt: You move money.
        tool_triggers: {pay: pay}
    verifier: {kind: none}
  tools:
  - {id: pay, kind: counting, effect: idempotent, x-count-by: keys}
turns:
- {conversation_id: c1, turn_id: '', text: pay the invoice}
- {conversation_id: c1, turn_id: t1, text: pay the invoice}
expect:
- turn_id: ''
  status: failed
  error_class: validation
  events: []
  state_includes: {turn_count: 0}
- turn_id: t1
  status: completed
  reply: '[main] pay returned 1'
  state_includes: {turn_count: 1}
