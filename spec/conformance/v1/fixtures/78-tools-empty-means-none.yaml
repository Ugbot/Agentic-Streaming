id: tools-empty-means-none
description: '`tools: []` is an empty list, not a wildcard: the model is offered nothing and a tool it names anyway
  is refused.'
requires: [tool_policy, llm_brain, tools]
workflow:
  spec_version: agentic/v1
  backend: local
  llm:
    provider: stub
    script:
    - {tool: safe, args: {}}
    - {text: never reached}
  agent:
    id: a
    router: {kind: static, default: main}
    paths:
      main: {brain: llm, prompt: Help., tools: []}
    verifier: {kind: none}
  tools:
  - {id: safe, kind: constant, effect: read, value: ok}
turns:
- {conversation_id: c1, turn_id: t1, text: go}
expect:
- turn_id: t1
  status: failed
  error_class: policy
  tool_calls: []
  events: [turn_received, routed, brain_started, llm_called, tool_refused, turn_failed]
