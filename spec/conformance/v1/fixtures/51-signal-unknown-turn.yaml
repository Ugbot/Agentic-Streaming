id: signal-unknown-turn
description: 'A signal for a turn nobody has seen is refused and appends nothing, so the turn_id is not spent: the turn itself still runs when it arrives.'
requires: [suspend_resume, tools, idempotency]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router:
      kind: keyword
      default: main
      rules:
        main: [pay, refund, hello]
    paths:
      main:
        brain: rule
        prompt: You move money.
        tool_triggers: {pay: pay}
        tools: [pay]
    verifier: {kind: none}
  tools:
  - {id: pay, kind: counting, effect: idempotent, x-count-by: keys}
  policies:
    approvers: {roles: [approver]}
turns:
- conversation_id: c1
  turn_id: t1
  signal: {kind: approval}
  principal: {subject: ops, roles: [approver]}
- {conversation_id: c1, turn_id: t1, text: pay the invoice}
expect:
- turn_id: t1
  status: failed
  error_class: validation
  events: []
  state_includes: {turn_count: 0}
- turn_id: t1
  status: completed
  reply: '[main] pay returned 1'
  state_includes: {turn_count: 1}
