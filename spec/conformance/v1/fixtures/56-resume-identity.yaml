id: resume-identity
description: 'The original user keeps the turn: a signal sent by someone else runs alice''s tool as alice, and the sender is recorded separately.'
requires: [suspend_resume, tools, idempotency]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router:
      kind: keyword
      default: main
      rules:
        main: [pay, refund, hello]
    paths:
      main:
        brain: rule
        prompt: You move money.
        tool_triggers: {pay: pay}
        x-suspend-until: approval
        tools: [pay]
    verifier: {kind: none}
  tools:
  - {id: pay, kind: counting, effect: idempotent, x-count-by: keys}
turns:
- {conversation_id: c1, turn_id: t1, text: pay the invoice, user_id: alice}
- conversation_id: c1
  turn_id: t1
  signal: {kind: approval}
  user_id: mallory
expect:
- turn_id: t1
  status: suspended
  event_payloads:
  - type: turn_received
    payload: {user_id: alice}
- turn_id: t1
  status: completed
  tool_calls:
  - tool: pay
    index: 0
    args: {user: alice}
  event_payloads:
  - type: turn_resumed
    payload: {signal_sender: mallory}
