id: unauthorised-settlement
description: 'Settling an unknown outcome is privileged, because not_applied makes the call again. Someone who is not an approver changes nothing: the journal entry stays unknown and the tool is not called.'
requires: [principal, crash_recovery, effect_journal, suspend_resume, tools, rule_brain]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router: {kind: static, default: main}
    paths:
      main:
        brain: rule
        tools: [pay]
        tool_triggers: {pay: pay}
    verifier: {kind: none}
  policies:
    approvers: {roles: [approver]}
  tools:
  - {id: pay, kind: counting, effect: non_idempotent}
turns:
- conversation_id: c1
  turn_id: t1
  text: pay it
  principal: {subject: alice, tenant: acme}
  crash_at: {call: pay, when: during}
- {conversation_id: c1, turn_id: t1, text: pay it, principal: {subject: alice, tenant: acme}}
- conversation_id: c1
  turn_id: t1
  signal: {resolution: not_applied}
  principal: {subject: mallory, tenant: acme}
- {conversation_id: c1, turn_id: t1, text: pay it, principal: {subject: alice, tenant: acme}}
- conversation_id: c1
  turn_id: t1
  signal: {resolution: applied, result: paid}
  principal: {subject: ops, tenant: acme, roles: [approver]}
expect:
- {turn_id: t1, status: crashed}
- {turn_id: t1, status: suspended}
- {turn_id: t1, status: failed, error_class: policy, tool_calls: [], events: [signal_refused]}
- {turn_id: t1, status: duplicate}
- {turn_id: t1, status: completed, reply: '[main] pay returned paid'}
