id: unknown-outcome-applied
description: A person says the call landed and what it returned. The turn carries on with that result and the tool is not called.
requires: [crash_recovery, effect_journal, tools, idempotency, suspend_resume]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router:
      kind: keyword
      default: main
      rules:
        main: [pay, refund, hello]
    paths:
      main:
        brain: rule
        prompt: You move money.
        tool_triggers: {pay: pay}
        tools: [pay]
    verifier: {kind: none}
  tools:
  - {id: pay, kind: counting, effect: non_idempotent}
turns:
- conversation_id: c1
  turn_id: t1
  text: pay the invoice
  crash_at: {call: pay, when: during}
- {conversation_id: c1, turn_id: t1, text: pay the invoice}
- conversation_id: c1
  turn_id: t1
  signal: {resolution: applied, result: paid}
  user_id: ops
expect:
- {turn_id: t1, status: crashed}
- turn_id: t1
  status: suspended
  events: [turn_received, routed, brain_started, tool_intent, unknown_outcome, turn_suspended]
- turn_id: t1
  status: completed
  reply: '[main] pay returned paid'
  events: [turn_resumed, tool_called, reply_drafted, memory_written, turn_completed]
  tool_calls:
  - {tool: pay, index: 0, attempt: 1, result: paid}
  event_payloads:
  - type: turn_resumed
    payload: {signal_sender: ops}
