id: approval-survives-a-crash
description: 'An approval is on the log, so a crash just after it loses nothing: the redelivered signal runs the call once, and asks nobody twice.'
requires: [tool_approval, tool_policy, crash_recovery, effect_journal, suspend_resume, tools]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router: {kind: static, default: main}
    paths:
      main:
        brain: rule
        tools: [pay]
        tool_triggers: {pay: pay}
    verifier: {kind: none}
  policies:
    approvers: {roles: [approver]}
    tool_approval: {effects: [non_idempotent]}
  tools:
  - {id: pay, kind: counting, effect: non_idempotent}
turns:
- {conversation_id: c1, turn_id: t1, text: pay it}
- conversation_id: c1
  turn_id: t1
  signal: {approved: true}
  principal: {subject: ops, roles: [approver]}
  crash_at: {event: turn_resumed, when: after}
- conversation_id: c1
  turn_id: t1
  signal: {approved: true}
  principal: {subject: ops, roles: [approver]}
expect:
- {turn_id: t1, status: suspended}
- {turn_id: t1, status: crashed}
- {turn_id: t1, status: completed, reply: '[main] pay returned 1'}
