id: unattended-tool-cannot-wait
description: 'A timer has nobody to ask, so a tool that needs a person is refused rather than left hanging.'
requires: [tool_approval, tool_policy, timers, effect_journal, tools]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: a
    router: {kind: static, default: main}
    paths:
      main: {brain: rule}
    verifier: {kind: none}
  policies:
    unattended_tools: [remind]
    tool_approval: {tools: [remind]}
  timers:
  - {id: nudge, after_ms: 1000, tool: remind}
  tools:
  - {id: remind, kind: counting, effect: idempotent}
turns:
- {conversation_id: c1, turn_id: t1, text: hello}
- {conversation_id: c1, turn_id: t2, text: hello, advance_time_ms: 2000}
expect:
- {turn_id: t1, status: completed}
- turn_id: t2
  status: failed
  error_class: policy
  tool_calls: []
  events: [timer_fired, tool_refused, turn_failed]
