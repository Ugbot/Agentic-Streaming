id: rule-tool-outside-path
description: 'A rule brain is held to the path''s tools. A trigger naming a tool the path does not list is refused
  at the tool boundary: nothing runs, the refusal is on the log, and the turn fails with class policy.'
requires: [tool_policy, rule_brain, tools]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router: {kind: static, default: main}
    paths:
      main:
        brain: rule
        tools: [safe]
        tool_triggers: {wire: wire}
    verifier: {kind: none}
  tools:
  - {id: safe, kind: constant, effect: read, value: ok}
  - {id: wire, kind: counting, effect: idempotent}
turns:
- {conversation_id: c1, turn_id: t1, text: wire the money}
- {conversation_id: c1, turn_id: t1, text: wire the money}
expect:
- turn_id: t1
  status: failed
  error_class: policy
  tool_calls: []
  events: [turn_received, routed, brain_started, tool_refused, turn_failed]
  event_payloads:
  - type: tool_refused
    payload: {tool: wire, origin: brain, path: main}
- {turn_id: t1, status: duplicate, error_class: policy, tool_calls: []}
