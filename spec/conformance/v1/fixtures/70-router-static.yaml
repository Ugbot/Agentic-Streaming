id: router-static
description: A static router always takes router.default, whatever the text says.
requires: [routing]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router: {kind: static, default: main}
    paths:
      main: {brain: rule, prompt: You move money.}
    verifier: {kind: none}
turns:
- {conversation_id: c1, turn_id: t1, text: anything}
expect:
- {turn_id: t1, status: completed, path: main}
