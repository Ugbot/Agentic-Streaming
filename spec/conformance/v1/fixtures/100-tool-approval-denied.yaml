id: tool-approval-denied
description: 'An approver who says no refuses the call: nothing ran, and the turn ends with class policy.'
requires: [tool_approval, tool_policy, effect_journal, suspend_resume, tools]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router: {kind: static, default: main}
    paths:
      main:
        brain: rule
        tools: [pay]
        tool_triggers: {pay: pay}
    verifier: {kind: none}
  policies:
    approvers: {roles: [approver]}
    tool_approval: {effects: [non_idempotent]}
  tools:
  - {id: pay, kind: counting, effect: non_idempotent}
turns:
- {conversation_id: c1, turn_id: t1, text: pay it}
- conversation_id: c1
  turn_id: t1
  signal: {approved: false}
  principal: {subject: ops, roles: [approver]}
expect:
- {turn_id: t1, status: suspended}
- turn_id: t1
  status: failed
  error_class: policy
  tool_calls: []
  events_include: [turn_resumed, tool_refused, turn_failed]
  events_exclude: [tool_intent]
