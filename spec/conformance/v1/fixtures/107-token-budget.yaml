id: token-budget
description: 'A spent token budget stops the next model call: the turn ends with class policy and the model is not asked.'
requires: [limits, llm_brain, tools]
workflow:
  spec_version: agentic/v1
  backend: local
  llm:
    provider: stub
    script:
    - {tool: look, args: {}}
    - {text: done}
  agent:
    id: a
    router: {kind: static, default: main}
    paths:
      main: {brain: llm, prompt: Help., tools: [look]}
    verifier: {kind: none}
  policies:
    limits: {tokens_per_day: 1}
  tools:
  - {id: look, kind: constant, effect: read, value: ok}
turns:
- {conversation_id: c1, turn_id: t1, text: go, principal: {subject: alice}}
expect:
- turn_id: t1
  status: failed
  error_class: policy
  events: [turn_received, routed, brain_started, llm_called, tool_intent, tool_called, limit_exceeded, turn_failed]
  event_payloads:
  - type: limit_exceeded
    payload: {limit: tokens_per_day, who: alice, max: 1}
