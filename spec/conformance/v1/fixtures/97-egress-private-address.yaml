id: egress-private-address
description: 'A private address is refused, and a refused call is a definite failure: nothing was sent, so a non_idempotent tool does not wait for a person.'
requires: [tool_policy, effect_journal, tools]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: fetcher
    router: {kind: static, default: main}
    paths:
      main:
        brain: rule
        tools: [fetch]
        tool_triggers: {fetch: fetch}
    verifier: {kind: none}
  tools:
  - {id: fetch, kind: http, effect: non_idempotent, url: 'http://10.20.30.40:8080/pay'}
turns:
- {conversation_id: c1, turn_id: t1, text: fetch it}
expect:
- turn_id: t1
  status: failed
  error_class: tool
  tool_calls:
  - {tool: fetch, index: 0, attempt: 1, failed: true}
  events_exclude: [unknown_outcome]
  event_payloads:
  - type: tool_failed
    payload: {error: 'fetch failed: blocked by egress policy'}
