id: tools-absent-means-none
description: A path that declares no tools has none. Deny by default does not depend on spelling out an empty list.
requires: [tool_policy, rule_brain, tools]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: a
    router: {kind: static, default: main}
    paths:
      main:
        brain: rule
        tool_triggers: {go: safe}
    verifier: {kind: none}
  tools:
  - {id: safe, kind: constant, effect: read, value: ok}
turns:
- {conversation_id: c1, turn_id: t1, text: go}
expect:
- turn_id: t1
  status: failed
  error_class: policy
  tool_calls: []
  events: [turn_received, routed, brain_started, tool_refused, turn_failed]
