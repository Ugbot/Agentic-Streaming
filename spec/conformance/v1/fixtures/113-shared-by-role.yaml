id: shared-by-role
description: 'policies.sharing.roles lets another principal of the same tenant with one of those roles add turns. Without the role, or from another tenant with it, the turn is refused.'
requires: [principal, tools, rule_brain]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router: {kind: static, default: main}
    paths:
      main:
        brain: rule
        tools: [pay]
        tool_triggers: {pay: pay}
    verifier: {kind: none}
  policies:
    sharing: {roles: [support]}
  tools:
  - {id: pay, kind: counting, effect: idempotent}
turns:
- {conversation_id: c1, turn_id: t1, text: pay it, principal: {subject: alice, tenant: acme}}
- {conversation_id: c1, turn_id: t2, text: pay it, principal: {subject: bob, tenant: acme, roles: [support]}}
- {conversation_id: c1, turn_id: t3, text: pay it, principal: {subject: carol, tenant: acme}}
- {conversation_id: c1, turn_id: t4, text: pay it, principal: {subject: dave, tenant: beta, roles: [support]}}
expect:
- {turn_id: t1, status: completed}
- {turn_id: t2, status: completed, tool_calls: [{tool: pay, index: 0, args: {user: bob}}]}
- {turn_id: t3, status: failed, error_class: policy, tool_calls: [], events: []}
- {turn_id: t4, status: failed, error_class: policy, tool_calls: [], events: []}
