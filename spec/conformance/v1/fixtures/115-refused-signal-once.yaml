id: refused-signal-once
description: 'A refused signal is on the log once per sender and turn. The same sender again, or anyone unauthenticated again under any name, is refused with nothing appended, so a non-approver cannot grow the log.'
requires: [principal, suspend_resume, tools, rule_brain]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router: {kind: static, default: main}
    paths:
      main:
        brain: rule
        tools: [pay]
        tool_triggers: {pay: pay}
        x-suspend-until: approval
    verifier: {kind: none}
  policies:
    approvers: {roles: [approver]}
  tools:
  - {id: pay, kind: counting, effect: idempotent}
turns:
- {conversation_id: c1, turn_id: t1, text: pay it, principal: {subject: alice, tenant: acme}}
- {conversation_id: c1, turn_id: t1, signal: {kind: approval}, principal: {subject: mallory, tenant: acme}}
- {conversation_id: c1, turn_id: t1, signal: {kind: approval}, principal: {subject: mallory, tenant: acme}}
- {conversation_id: c1, turn_id: t1, signal: {kind: approval}, principal: {subject: mallory, tenant: acme, roles: [x]}}
- {conversation_id: c1, turn_id: t1, signal: {kind: approval}, principal: {subject: eve, tenant: acme}}
- {conversation_id: c1, turn_id: t1, signal: {kind: approval}, user_id: ops}
- {conversation_id: c1, turn_id: t1, signal: {kind: approval}, user_id: someone-else}
- {conversation_id: c1, turn_id: t1, signal: {kind: approval}, principal: {subject: ops, tenant: acme, roles: [approver]}}
expect:
- {turn_id: t1, status: suspended}
- turn_id: t1
  status: failed
  error_class: policy
  events: [signal_refused]
  event_payloads:
  - type: signal_refused
    payload: {signal_sender: mallory}
- {turn_id: t1, status: failed, error_class: policy, tool_calls: [], events: []}
- {turn_id: t1, status: failed, error_class: policy, tool_calls: [], events: []}
- {turn_id: t1, status: failed, error_class: policy, events: [signal_refused]}
- {turn_id: t1, status: failed, error_class: policy, events: [signal_refused]}
- {turn_id: t1, status: failed, error_class: policy, tool_calls: [], events: []}
- turn_id: t1
  status: completed
  tool_calls:
  - {tool: pay, index: 0, args: {user: alice}}
