id: timer-tool-refused
description: 'A timer runs outside any path, so its tool must be in policies.unattended_tools. One that is not is
  refused and fails the turn that observed the deadline; the next turn runs.'
requires: [tool_policy, timers, tools]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: a
    router: {kind: static, default: main}
    paths:
      main: {brain: rule, tools: [remind]}
    verifier: {kind: none}
  timers:
  - {id: nudge, after_ms: 1000, tool: remind, payload: {why: late}}
  tools:
  - {id: remind, kind: counting, effect: idempotent}
turns:
- {conversation_id: c1, turn_id: t1, text: hello}
- {conversation_id: c1, turn_id: t2, text: hello, advance_time_ms: 2000}
- {conversation_id: c1, turn_id: t3, text: hello}
expect:
- {turn_id: t1, status: completed}
- turn_id: t2
  status: failed
  error_class: policy
  tool_calls: []
  events: [timer_fired, tool_refused, turn_failed]
  event_payloads:
  - type: tool_refused
    payload: {tool: remind, origin: timer}
- {turn_id: t3, status: completed, tool_calls: []}
