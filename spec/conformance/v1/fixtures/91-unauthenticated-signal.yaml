id: unauthenticated-signal
description: 'A name is not a principal. A signal that only claims the right user_id is refused, even when that subject is an approver.'
requires: [principal, suspend_resume, tools, rule_brain]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router: {kind: static, default: main}
    paths:
      main:
        brain: rule
        tools: [pay]
        tool_triggers: {pay: pay}
        x-suspend-until: approval
    verifier: {kind: none}
  policies:
    approvers: {subjects: [ops]}
  tools:
  - {id: pay, kind: counting, effect: idempotent}
turns:
- {conversation_id: c1, turn_id: t1, text: pay it, principal: {subject: alice, tenant: acme}}
- conversation_id: c1
  turn_id: t1
  signal: {kind: approval}
  user_id: ops
- conversation_id: c1
  turn_id: t1
  signal: {kind: approval}
  principal: {subject: ops, tenant: acme}
expect:
- {turn_id: t1, status: suspended}
- {turn_id: t1, status: failed, error_class: policy, events: [signal_refused]}
- {turn_id: t1, status: completed}
