id: redelivery-mid-turn
description: A partial turn redelivered is finished once. Later deliveries are duplicates, including after a restart,
  and turn_received is counted once.
requires: [crash_recovery, effect_journal, tools, idempotency, durable_store]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router:
      kind: keyword
      default: main
      rules:
        main: [pay, refund, hello]
    paths:
      main:
        brain: rule
        prompt: You move money.
        tool_triggers: {pay: pay}
    verifier: {kind: none}
  tools:
  - {id: pay, kind: counting, effect: idempotent, x-count-by: keys}
turns:
- conversation_id: c1
  turn_id: t1
  text: pay the invoice
  crash_at: {event: tool_called, when: after}
- {conversation_id: c1, turn_id: t1, text: pay the invoice}
- {conversation_id: c1, turn_id: t1, text: pay the invoice}
- {conversation_id: c1, turn_id: t1, text: pay the invoice, restart_runtime: true}
expect:
- {turn_id: t1, status: crashed}
- {turn_id: t1, status: completed, reply: '[main] pay returned 1'}
- turn_id: t1
  status: duplicate
  reply: '[main] pay returned 1'
  events: []
- turn_id: t1
  status: duplicate
  reply: '[main] pay returned 1'
  state_includes: {turn_count: 1}
