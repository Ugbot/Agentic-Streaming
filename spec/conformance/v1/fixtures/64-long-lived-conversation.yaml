id: long-lived-conversation
description: A conversation that outlives a restart keeps a dense log and counts every turn. The workflow sets an
  idle TTL, which must not touch a live conversation; a duplicate of its first turn is still answered from the log.
requires: [memory, idempotency, durable_store]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router:
      kind: keyword
      default: main
      rules:
        main: [pay, refund, hello]
    paths:
      main: {brain: rule, prompt: You move money.}
    verifier: {kind: none}
  runtime:
    flink: {state_ttl_ms: 3600000}
turns:
- {conversation_id: c1, turn_id: t1, text: hello 1}
- {conversation_id: c1, turn_id: t2, text: hello 2}
- {conversation_id: c1, turn_id: t3, text: hello 3}
- {conversation_id: c1, turn_id: t4, text: hello 4}
