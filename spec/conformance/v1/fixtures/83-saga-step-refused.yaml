id: saga-step-refused
description: 'A saga step is held to the routed path''s tools. A refused step is a failed step: what ran before it
  compensates and the turn fails with class policy.'
requires: [tool_policy, saga, tools]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: a
    router: {kind: static, default: main}
    paths:
      main: {brain: rule, tools: [reserve, release]}
    verifier: {kind: none}
  saga:
    steps:
    - {name: hold, tool: reserve, compensate_with: release}
    - {name: charge, tool: charge}
  tools:
  - {id: reserve, kind: constant, effect: idempotent, value: held}
  - {id: release, kind: constant, effect: idempotent, value: released}
  - {id: charge, kind: counting, effect: idempotent}
turns:
- {conversation_id: c1, turn_id: t1, text: go}
expect:
- turn_id: t1
  status: failed
  error_class: policy
  events: [turn_received, routed, tool_intent, tool_called, tool_refused, compensation_started, tool_intent, compensation_step, compensation_completed, turn_failed]
  event_payloads:
  - type: tool_refused
    payload: {tool: charge, origin: saga, path: main}
