id: cep-tool-refused
description: A pattern's on_match tool is held to policies.unattended_tools. Being named by the pattern is not a grant.
requires: [tool_policy, cep, tools]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: a
    router: {kind: static, default: main}
    paths:
      main: {brain: rule, tools: [open_ticket]}
    verifier: {kind: none}
  cep:
  - name: two
    pattern:
    - {where: {text_contains: first}}
    - {where: {text_contains: second}}
    on_match: {kind: tool, tool: open_ticket}
  tools:
  - {id: open_ticket, kind: counting, effect: idempotent}
turns:
- {conversation_id: c1, turn_id: t1, text: first}
- {conversation_id: c1, turn_id: t2, text: second}
expect:
- {turn_id: t1, status: completed}
- turn_id: t2
  status: failed
  error_class: policy
  tool_calls: []
  events: [turn_received, routed, tool_refused, turn_failed]
  event_payloads:
  - type: tool_refused
    payload: {tool: open_ticket, origin: cep}
