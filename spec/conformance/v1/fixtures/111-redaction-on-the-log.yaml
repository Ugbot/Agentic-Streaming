id: redaction-on-the-log
description: What looks like a credential, and what the workflow names, is gone before the event or the journal entry is written, wherever it came from. The reply a person sees is theirs; the record of it is not.
requires: [redaction, rule_brain, tools]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: a
    router: {kind: static, default: main}
    paths:
      main:
        brain: rule
        tools: [lookup]
        tool_triggers: {look: lookup}
    verifier: {kind: none}
  policies:
    redact:
      fields: [ssn]
      patterns: ['\b\d{4}-\d{4}-\d{4}-\d{4}\b']
  tools:
  - id: lookup
    kind: constant
    effect: read
    value: {name: ann, ssn: 078-05-1120, password: hunter2, card: 4111-1111-1111-1111, note: 'token sk-abcdefghijklmnopqrstuvwx'}
turns:
- {conversation_id: c1, turn_id: t1, text: 'look up Bearer abcdefghijklmnop please'}
expect:
- turn_id: t1
  status: completed
  event_payloads:
  - type: turn_received
    payload: {text: 'look up [redacted] please'}
  - type: tool_called
    payload:
      result: {name: ann, ssn: '[redacted]', password: '[redacted]', card: '[redacted]', note: 'token [redacted]'}
