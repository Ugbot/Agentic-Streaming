id: unauthorised-approver
description: 'A signal from someone who is not an approver is refused with class policy. The attempt is on the log, the turn stays suspended, and an approver can still answer.'
requires: [principal, suspend_resume, tools, rule_brain]
workflow:
  spec_version: agentic/v1
  backend: local
  agent:
    id: pay
    router: {kind: static, default: main}
    paths:
      main:
        brain: rule
        tools: [pay]
        tool_triggers: {pay: pay}
        x-suspend-until: approval
    verifier: {kind: none}
  policies:
    approvers: {roles: [approver]}
  tools:
  - {id: pay, kind: counting, effect: idempotent}
turns:
- {conversation_id: c1, turn_id: t1, text: pay it, principal: {subject: alice, tenant: acme}}
- conversation_id: c1
  turn_id: t1
  signal: {kind: approval}
  principal: {subject: mallory, tenant: acme}
- conversation_id: c1
  turn_id: t1
  signal: {kind: approval}
  principal: {subject: ops, tenant: acme, roles: [approver]}
expect:
- {turn_id: t1, status: suspended}
- turn_id: t1
  status: failed
  error_class: policy
  tool_calls: []
  events: [signal_refused]
  event_payloads:
  - type: signal_refused
    payload: {signal_sender: mallory}
- turn_id: t1
  status: completed
  tool_calls:
  - {tool: pay, index: 0, args: {user: alice}}
