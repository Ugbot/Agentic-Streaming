services:
  # PostgreSQL - Durable storage for conversations
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: agentic-flink-postgres
    environment:
      POSTGRES_DB: agentic_flink
      POSTGRES_USER: flink_user
      # No committed credential: set POSTGRES_PASSWORD in .env (see .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flink_user -d agentic_flink"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic-flink-network

  # Redis - Fast caching layer for active contexts
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: agentic-flink-redis
    # No committed credential: set REDIS_PASSWORD in .env (see .env.example).
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic-flink-network

  # Ollama - Local LLM inference
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: agentic-flink-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - agentic-flink-network
    # Optional: Download a model on startup
    # entrypoint: ["/bin/sh", "-c"]
    # command: ["ollama serve & sleep 10 && ollama pull qwen2.5:3b && wait"]

  # Optional: Qdrant vector database for RAG
  # Uncomment if you need vector search capabilities
  # qdrant:
  #   image: docker.io/qdrant/qdrant:latest
  #   container_name: agentic-flink-qdrant
  #   ports:
  #     - "127.0.0.1:6333:6333"
  #     - "127.0.0.1:6334:6334"
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - agentic-flink-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  # qdrant_data:
  #   driver: local

networks:
  # Shared with every other compose file; create it once with examples-bin/setup-network.sh.
  agentic-flink-network:
    external: true
