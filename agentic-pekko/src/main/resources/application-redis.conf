# Cluster + Redis (event-sourced via the in-module RedisJournal, see reference.conf).
# Run with: -Dconfig.resource=application-redis.conf  AGENTIC_REDIS_URL=redis://host:6379/0
# The Redis MUST persist: appendonly yes (appendfsync always for zero loss window); the journal
# verifies this at start and refuses a cache-only server.
include "application.conf"

agentic-redis-journal.url = ${?AGENTIC_REDIS_URL}
agentic-redis-snapshot-store.url = ${?agentic-redis-journal.url}

pekko {
  actor.provider = "cluster"
  remote.artery.canonical {
    hostname = ${?AGENTIC_PEKKO_HOST}
    port = ${?AGENTIC_PEKKO_PORT}
  }
  cluster.seed-nodes = ["pekko://AgenticPekko@127.0.0.1:25520"]

  persistence {
    journal.plugin = "agentic-redis-journal"
    snapshot-store.plugin = "agentic-redis-snapshot-store"
  }
}
