# Plugin definitions for the Redis journal/snapshot store implemented in this module
# (org.jagentic.pekko.persistence.redis). Selected by application-redis.conf via
# pekko.persistence.journal.plugin; nothing in the entity knows they exist.

agentic-redis-journal {
  class = "org.jagentic.pekko.persistence.redis.RedisJournal"
  plugin-dispatcher = "pekko.persistence.dispatchers.default-plugin-dispatcher"

  # `url` (redis://[:password@]host[:port][/db]) is mandatory and deliberately NOT defaulted here:
  # application-redis.conf binds it to AGENTIC_REDIS_URL; the plugin refuses to start without it.
  key-prefix = "agentic"
  replay-batch = 512
  connect-timeout = 5s

  # Verify at start that the server persists (CONFIG GET appendonly == yes) and fail loudly
  # otherwise. Turn off ONLY for managed Redis (Enterprise / Valkey persistence) that forbids
  # CONFIG; it is logged at WARN on every start. appendfsync is reported but not enforced:
  #   always   -> an acknowledged event is fsynced before the entity treats it as persisted
  #   everysec -> up to ~1s of acknowledged events lost on power failure / kernel panic (not on
  #               a redis process crash); Redis' default when AOF is enabled
  #   no       -> loss window is OS-dependent (typically <= 30s)
  durability-check = on
}

agentic-redis-snapshot-store {
  class = "org.jagentic.pekko.persistence.redis.RedisSnapshotStore"
  plugin-dispatcher = "pekko.persistence.dispatchers.default-plugin-dispatcher"
  key-prefix = ${agentic-redis-journal.key-prefix}
  replay-batch = ${agentic-redis-journal.replay-batch}
  connect-timeout = ${agentic-redis-journal.connect-timeout}
  durability-check = ${agentic-redis-journal.durability-check}
}
