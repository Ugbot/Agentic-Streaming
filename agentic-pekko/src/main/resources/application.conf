# Agentic Pekko — local single-node profile (the default for Main + dev).
# Cluster + JDBC/Cassandra/Redis profiles are the sibling application-*.conf resources.
pekko {
  loglevel = "INFO"

  actor {
    provider = "local"
    # Every actor message/event/state crossing the wire or a journal uses jackson-cbor,
    # never Java serialization. The inmem journal round-trips every event through it too
    # (test-serialization below), so the MEMORY profile catches what a real journal would.
    serialization-bindings {
      "org.jagentic.pekko.serialization.CborSerializable" = jackson-cbor
    }
  }

  # Journal payloads are plain Java maps; without DefaultScalaModule (in Pekko's default list)
  # nested untyped objects come back as scala.collection.immutable.Map, which the entity's
  # payload readers cannot treat as java.util.Map.
  serialization.jackson.jackson-modules = [
    "org.apache.pekko.serialization.jackson.PekkoJacksonModule",
    "org.apache.pekko.serialization.jackson.PekkoTypedJacksonModule",
    "org.apache.pekko.serialization.jackson.PekkoStreamJacksonModule",
    "com.fasterxml.jackson.module.paramnames.ParameterNamesModule",
    "com.fasterxml.jackson.datatype.jdk8.Jdk8Module",
    "com.fasterxml.jackson.datatype.jsr310.JavaTimeModule"
  ]

  persistence {
    # Event-sourced conversation entities. Dev/local uses the in-memory journal; the
    # postgres/cassandra/redis profiles swap journal.plugin.
    journal.plugin = "pekko.persistence.journal.inmem"
    journal.inmem.test-serialization = on
    snapshot-store.plugin = "pekko.persistence.snapshot-store.local"
    snapshot-store.local.dir = "target/pekko-snapshots"
  }
}
