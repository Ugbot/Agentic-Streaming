[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-pyflink"
# The version is the release tag (v<PEP 440>) of the repository, read by setuptools-scm.
# The four Python packages of this repository share one tag; see docs/release.md.
dynamic = ["version"]
description = "Run portable agentic/v1 workflow documents on Apache Flink from Python (PyFlink)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Agentic Streaming contributors" }]
keywords = ["agentic", "flink", "pyflink", "agents", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "apache-flink>=2.0,<3",
    "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=7", "jsonschema>=4"]

# Discovery hook for the shared Python surface (`agentic.runtime.get_runtime("pyflink")`).
# `flink-jvm` is the JPype facade in python/ (agentic-flink); the two names never collide.
[project.entry-points."agentic.runtimes"]
pyflink = "agentic_pyflink.runtime:FlinkRuntime"

[project.urls]
Repository = "https://github.com/Ugbot/Agentic-Streaming"
Documentation = "https://github.com/Ugbot/Agentic-Streaming/blob/main/docs/python.md"

# Dev and test installs: `uv sync` in this directory (see docs/release.md). uv is not needed to
# install or use the wheel. The Java artifacts (the framework uber jar and the bridge jar under
# pyflink/java) are not part of this wheel; agentic_pyflink.jars finds them in a source checkout
# or through AGENTIC_FLINK_UBER_JAR / AGENTIC_PYFLINK_JAR.
[dependency-groups]
dev = ["pytest>=7", "jsonschema>=4", "build>=1.2", "twine>=5"]

[tool.setuptools_scm]
root = ".."
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_pyflink*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
agentic_pyflink = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
