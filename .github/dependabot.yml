# Dependabot: weekly dependency updates, with minor and patch bumps grouped into one pull request
# per ecosystem so the noise stays low. Major bumps open one pull request each.
#
# Maven lists /reactor alone. reactor/pom.xml names every module (`..` and `../<module>`), so
# Dependabot reaches them all from there. Listing the modules as well made the directories overlap:
# a file fetched through /reactor was assigned to /reactor, the job for the other directory found no
# file of its own, and the grouped update failed with "No pom.xml!".
# pip: the two Python distributions. github-actions: the workflows under .github/workflows.
version: 2
updates:
  - package-ecosystem: maven
    directory: /reactor
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      maven-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directories:
      - /ports/pyagentic
      - /ports/agentic-pipeline
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      pip-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
