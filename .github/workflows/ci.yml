name: CI

# Builds and tests every language surface in the repo.
#
# Required status checks (branch protection should list exactly these):
#   core     the whole Maven reactor (reactor/pom.xml) in one invocation, with the
#            integration-tests profile and the backing services it needs
#   python   the pure-Python core (ports/pyagentic) with its service-backed tests, the pipeline
#            CLI (ports/agentic-pipeline) and the docs checks
# The conformance matrix is a required check too; it lives in conformance.yml and is
# not repeated here.
#
# Skips are audited. The Maven *IT classes start their own Redis container through
# Testcontainers and fail (never skip) without a container runtime; the remaining service-backed tests skip themselves when Postgres,
# Redis, Kafka, Qdrant or a Python with the MCP SDK is unreachable, so in CI those services
# are provisioned and tools/ci/skip_audit.py fails the job for any skip whose reason is not
# written down in tools/ci/skip-allowlist.txt (declared conformance capability gaps, Ollama,
# and the two AGENTIC_PEKKO_INTEGRATION tests explained on the core job).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Every service-backed suite in the reactor reads these; the values match the ports the
  # tests default to (StoreTest, RedisToolBridgeTest, KafkaToolBridgeTest, pyagentic tests).
  AGENTIC_TEST_PG_JDBC: jdbc:postgresql://localhost:5434/agentic
  AGENTIC_TEST_PG_URL: postgresql://agentic:agentic@localhost:5434/agentic
  AGENTIC_TEST_QDRANT_URL: http://localhost:6333
  AGENTIC_TEST_REDIS_URL: redis://localhost:6380/0
  AGENTIC_KAFKA_BOOTSTRAP: localhost:9092

jobs:
  core:
    name: core (Maven reactor)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      # AGENTIC_REDIS_URL is deliberately not set: the Redis journal suites start their own
      # container (RedisJournalIT) and one of them asserts that the REDIS profile refuses to
      # boot without the variable.
      #
      # AGENTIC_PEKKO_INTEGRATION is deliberately not set. It enables two
      # @EnabledIfEnvironmentVariable tests in agentic-pekko that fail against the provisioned
      # services independent of this workflow, so enabling them would only turn the job red:
      # - DurabilityProfileTest.postgresJournalSurvivesEntityRestart: application-cluster-jdbc.conf
      #   configures the database under pekko.persistence.jdbc.shared-databases, but
      #   pekko-persistence-jdbc 1.1.0 reads pekko-persistence-jdbc.shared-databases, so the
      #   jdbc-snapshot-store actor fails to start ("No shared database is configured") and
      #   the profile's cluster seed node 127.0.0.1:25520 is never joined.
      # - AgentStreamTest.liveKafkaRoundTripProducesNormalizedResults: the round trip itself
      #   completes, then DrainingControl.drainAndShutdown does not finish within the test's
      #   30 second limit (reproduced twice against apache/kafka:3.9.0).
      # Their skip reason is allowlisted in tools/ci/skip-allowlist.txt; remove that entry
      # and set the variable here once agentic-pekko fixes both.
      # jagentic-core McpTest spawns a stdio MCP server with this interpreter.
      AGENTIC_TEST_PYTHON: /tmp/mcp-venv/bin/python
    services:
      # The *IT classes run by failsafe in the integration-tests profile start their own
      # containers through the runner's Docker socket; the containers below serve the tests that connect to a fixed localhost
      # port instead.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic
          POSTGRES_DB: agentic
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U agentic -d agentic"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
      kafka:
        # KRaft single node; the image's default listener advertises localhost:9092.
        image: apache/kafka:3.9.0
        ports: ["9092:9092"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Wait for services without a health check
        run: tools/ci/wait-for-ports.sh localhost:6333 localhost:9092

      # McpTest's stub server is written against the mcp 1.x FastMCP API.
      - name: Python with the MCP SDK for McpTest
        run: |
          python -m venv /tmp/mcp-venv
          /tmp/mcp-venv/bin/pip install "mcp<2"

      # One reactor invocation builds every first-class module in dependency order and
      # runs its tests: the unit suite through surefire, then the *IT classes through
      # failsafe in the integration-test phase (the integration-tests profile binds it in
      # reactor/pom.xml).
      - name: Maven reactor (integration-tests profile)
        run: >-
          ./mvnw -B -ntp -f reactor/pom.xml install
          -P integration-tests

      - name: Shaded framework jar is present
        run: |
          ls -l target/agentic-flink-*-uber.jar
          test "$(ls target/agentic-flink-*-uber.jar | wc -l)" -eq 1

      - name: Skip audit (a skip in CI must be allowlisted)
        if: always()
        run: >-
          python tools/ci/skip_audit.py --allowlist tools/ci/skip-allowlist.txt
          '**/target/surefire-reports/TEST-*.xml' '**/target/failsafe-reports/TEST-*.xml'

      - name: Collect test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-test-reports
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/surefire-reports/*.txt
            **/target/failsafe-reports/TEST-*.xml
            **/target/failsafe-reports/*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Shaded framework jar
        uses: actions/upload-artifact@v6
        with:
          name: agentic-flink-uber-jar
          path: target/agentic-flink-*-uber.jar
          if-no-files-found: error
          retention-days: 7

  python:
    name: python (ports/pyagentic, ports/agentic-pipeline, docs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic
          POSTGRES_DB: agentic
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U agentic -d agentic"
          --health-interval 5s --health-timeout 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      # The docs tests compile the Java snippets against the root module.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ports/pyagentic/pyproject.toml
            ports/agentic-pipeline/pyproject.toml

      - name: Wait for services without a health check
        run: tools/ci/wait-for-ports.sh localhost:6333

      # The optional backends the service-backed tests importorskip on: qdrant-client and
      # psycopg for test_rag_memory, duckdb for test_hnsw, mcp 1.x for test_mcp (its stub
      # server uses the FastMCP API). litellm is not installed: the only test that needs it
      # also needs a live Ollama, which CI does not provide (see the allowlist).
      - name: Install
        run: >-
          python -m pip install -e "ports/pyagentic[test]" -e "ports/agentic-pipeline[test,redis]"
          "mcp<2" qdrant-client "psycopg[binary]" duckdb

      - name: pyagentic
        run: python -m pytest ports/pyagentic/tests -q -ra --junitxml build/junit/pyagentic.xml

      - name: agentic-pipeline
        run: python -m pytest ports/agentic-pipeline -q -ra --junitxml build/junit/agentic-pipeline.xml

      - name: docs
        run: |
          ./mvnw -B -ntp -q -f ports/jagentic-core/pom.xml install -DskipTests
          ./mvnw -B -ntp -q -f agentic-gateway/pom.xml install -DskipTests
          python -m pytest docs/tools/test_docs.py -q -ra --junitxml build/junit/docs.xml

      - name: Skip audit (a skip in CI must be allowlisted)
        if: always()
        run: python tools/ci/skip_audit.py --allowlist tools/ci/skip-allowlist.txt 'build/junit/*.xml'
