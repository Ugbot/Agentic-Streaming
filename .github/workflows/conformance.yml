name: Conformance matrix

# Validates the frozen agentic/v1 spec, runs the Python spec tooling tests, and
# executes the 15 shared conformance fixtures against every runtime binding
# present in the checkout through spec/tools/conformance_matrix.py. The runner
# invokes each runtime's own binding (reference runtime, JUnit ConformanceTest,
# FlinkConformanceHarness on MiniCluster, PekkoConformanceHarness,
# agentic.conformance/run-all, installed Python bindings); it never reimplements
# a runtime. The resulting artifact is what docs/capabilities.md is generated from.
#
# Honesty rules encoded here:
# - A runtime whose binding is not in the checkout is reported as not_tested by
#   name in the job summary and artifact; it is never silently omitted.
# - A runtime whose binding IS present must run: --require-present turns a
#   missing toolchain into a job failure instead of a not_tested cell.
# - No conformance fixture depends on PostgreSQL, Redis or Kafka (workflows
#   under spec/conformance/v1/workflows declare no external stores), so this
#   workflow starts no service containers rather than starting ones nothing uses.
#   Infrastructure-backed suites stay in ci.yml / the integration-tests profile.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  spec:
    name: Spec validation + tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spec/README.md
      - run: pip install jsonschema pyyaml pytest
      - name: Validate spec documents and fixtures
        run: python spec/tools/validate_spec.py
      - name: Reference runtime conformance
        run: python spec/tools/run_conformance.py
      - name: Spec tooling tests
        run: python -m pytest spec/tools -q

  matrix:
    name: Conformance matrix (all bindings in checkout)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: spec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spec/README.md
      - run: pip install jsonschema pyyaml pytest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Install the Python binding when the package is in the checkout
        run: |
          if [ -f ports/pyagentic/pyproject.toml ]; then
            pip install -e ports/pyagentic
          else
            echo "ports/pyagentic not present: python runtime will be reported as not_tested (binding absent)"
          fi
          # pyflink / python-jvm / python-flink run their own conformance modules over the shaded jar.
          if [ -f pyflink/pyproject.toml ]; then pip install -e pyflink; fi
          if [ -f python/pyproject.toml ]; then pip install -e python; fi
      - name: Build the shaded jar the Python-over-JVM bindings load
        run: |
          ./mvnw -B -ntp -q -f ports/jagentic-core/pom.xml install -DskipTests
          ./mvnw -B -ntp -q install -DskipTests
          if [ -f pyflink/java/pom.xml ]; then ./mvnw -B -ntp -q -f pyflink/java/pom.xml package -DskipTests; fi
      - name: Run the matrix
        run: |
          python spec/tools/conformance_matrix.py \
            --require reference \
            --require-present \
            --logs build/conformance-logs \
            --output build/conformance-matrix.json \
            --write-docs build/capabilities.md
      - name: Job summary
        if: always()
        run: |
          if [ -f build/capabilities.md ]; then
            cat build/capabilities.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "conformance_matrix.py produced no artifact; see the run log" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Generated docs/capabilities.md must match the artifact of this checkout
        if: hashFiles('docs/capabilities.md') != ''
        run: |
          python spec/tools/conformance_matrix.py --render build/conformance-matrix.json --write-docs build/capabilities.rendered.md
          # Compare only the capability table; runtime notes carry hostnames and durations.
          normalize() { sed -n '1,/^## Notes/p' "$1" | grep '^|'; }
          if [ "$(normalize build/capabilities.rendered.md | wc -l)" -eq 0 ]; then
            echo "::error::staleness check extracted no table rows from the rendered capabilities; the normalize() filter no longer matches the generator output"
            exit 1
          fi
          if ! diff <(normalize docs/capabilities.md) <(normalize build/capabilities.rendered.md); then
            echo "::error::docs/capabilities.md is stale for this checkout; regenerate with spec/tools/conformance_matrix.py --write-docs docs/capabilities.md"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-matrix
          path: |
            build/conformance-matrix.json
            build/capabilities.md
            build/conformance-logs/
          if-no-files-found: error
