name: Conformance matrix

# Validates the frozen agentic/v1 spec, runs the Python spec tooling tests, and
# executes the shared conformance fixtures under spec/conformance/v1 against every
# runtime binding present in the checkout through spec/tools/conformance_matrix.py. The runner
# invokes each runtime's own binding (reference runtime, JUnit ConformanceTest,
# FlinkConformanceHarness on MiniCluster, PekkoConformanceHarness, the installed Python
# binding); it never reimplements a runtime. The capability matrix is published as this
# workflow's artifact and job summary; no copy is committed until CI can regenerate it.
#
# Honesty rules encoded here:
# - A runtime whose binding is not in the checkout is reported as not_tested by
#   name in the job summary and artifact; it is never silently omitted.
# - A runtime whose binding IS present must run: --require-present turns a
#   missing toolchain into a job failure instead of a not_tested cell.
# - No conformance fixture depends on PostgreSQL, Redis or Kafka (workflows
#   under spec/conformance/v1/workflows declare no external stores), so this
#   workflow starts no service containers rather than starting ones nothing uses.
#   Infrastructure-backed suites stay in ci.yml / the integration-tests profile.
#
# Both jobs are meant to be required status checks (see the header of ci.yml).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily at 04:17 UTC, against main.
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  spec:
    name: Spec validation + tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spec/README.md
      - run: pip install jsonschema pyyaml pytest
      - name: Validate spec documents and fixtures
        run: python spec/tools/validate_spec.py
      - name: Reference runtime conformance
        run: python spec/tools/run_conformance.py
      - name: Spec tooling tests
        run: python -m pytest spec/tools -q

  matrix:
    name: Conformance matrix (all bindings in checkout)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: spec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spec/README.md
      - run: pip install jsonschema pyyaml pytest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install the Python binding when the package is in the checkout
        run: |
          if [ -f ports/pyagentic/pyproject.toml ]; then
            pip install -e ports/pyagentic
          else
            echo "ports/pyagentic not present: python runtime will be reported as not_tested (binding absent)"
          fi
      # One reactor build (reactor/pom.xml) in dependency order, for the JUnit conformance
      # suites conformance_matrix.py runs with `-f <module>/pom.xml test`. Tests are the
      # matrix's job, not this step's.
      - name: Build the reactor modules the bindings load
        run: >-
          ./mvnw -B -ntp -q -f reactor/pom.xml install -DskipTests
          -pl :jagentic-core,:agentic-flink,:agentic-pekko -am
      - name: Run the matrix
        run: |
          python spec/tools/conformance_matrix.py \
            --require reference \
            --require-present \
            --logs build/conformance-logs \
            --output build/conformance-matrix.json \
            --write-docs build/capabilities.md
      - name: Job summary
        if: always()
        run: |
          if [ -f build/capabilities.md ]; then
            cat build/capabilities.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "conformance_matrix.py produced no artifact; see the run log" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: conformance-matrix
          path: |
            build/conformance-matrix.json
            build/capabilities.md
            build/conformance-logs/
          if-no-files-found: error
