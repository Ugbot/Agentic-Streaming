name: Publish Python packages to PyPI

# Fires on every published GitHub Release.
# Uses PyPI Trusted Publishing (OIDC): no API tokens are stored in this repository.
# Configure the trusted publisher once on https://pypi.org/manage/account/publishing/
# (project: agentic-flink, owner: Ugbot, repo: Agentic-Streaming, workflow: publish-pypi.yml,
#  environment: pypi).
#
# NOTE: the repo was renamed Agentic-Flink -> Agentic-Streaming. PyPI matches the
# OIDC token's `repository` claim exactly, so the trusted publisher must be
# re-registered against Agentic-Streaming on pypi.org or this upload is rejected.
#
# Version: none of the four pyproject.toml files carries a version. setuptools-scm reads it from
# the release tag (v<PEP 440>, for example v1.0.0rc1), so the checkout must be exactly the tag
# with its history (fetch-depth 0). tools/check_release_version.py fails the job when the tag is
# not canonical, when any project resolves to a different version, or when an artifact is missing.
#
# All four distributions (pyagentic, agentic-flink, agentic-pyflink, agentic-pipeline) are built,
# checked and smoke tested together and kept as a workflow artifact. Only the ones listed in
# PUBLISH_DISTRIBUTIONS are uploaded; see docs/release.md for why the other three are not
# uploaded yet and what has to happen before they can be added to the list.
#
# The agentic-flink wheel bundles the shaded framework jar (python/setup.py copies
# target/agentic-flink-*-uber.jar into package data), so the Maven build runs first.

on:
  release:
    types: [published]
  # Manual fallback. Lets you re-publish without cutting a new GitHub Release
  # (e.g. if the upload step failed but the artifacts are fine). The tag must exist.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v1.0.0rc1)"
        required: true
        type: string

env:
  # Space separated distribution names whose sdist and wheel are uploaded by the publish job.
  PUBLISH_DISTRIBUTIONS: agentic-flink

jobs:
  build:
    name: Build, check and smoke test sdists and wheels
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          # setuptools-scm derives the version from the tag, so it needs the tags and the history.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine setuptools-scm

      - name: Check that the tag is canonical and that every project resolves to it
        run: python tools/check_release_version.py "$RELEASE_TAG"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The reactor (reactor/pom.xml) builds jagentic-core and then the framework module in
      # one invocation; `-pl :agentic-flink -am` limits it to those two. The shaded jar lands
      # at target/agentic-flink-<version>-uber.jar, where python/setup.py picks it up.
      - name: Build the shaded framework jar
        run: ./mvnw -B -ntp -f reactor/pom.xml -pl :agentic-flink -am -DskipTests package

      - name: Shaded framework jar is present
        run: test "$(ls target/agentic-flink-*-uber.jar | wc -l)" -eq 1

      - name: Build distributions (sdist and wheel for each of the four projects)
        run: |
          set -euo pipefail
          mkdir -p dist
          for project in ports/pyagentic python pyflink ports/agentic-pipeline; do
            echo "== $project"
            (cd "$project" && rm -rf dist && python -m build)
            cp "$project"/dist/* dist/
          done
          ls -l dist
          unzip -l dist/agentic_flink-*.whl | grep -E 'agentic_flink/jars/agentic-flink-.*-uber\.jar'

      - name: Check that every artifact carries the tagged version (sdist and wheel, all four)
        run: python tools/check_release_version.py "$RELEASE_TAG" --complete dist/*

      - name: Run twine check
        run: python -m twine check --strict dist/*

      - name: Smoke test the wheels in a fresh virtualenv (install, import, one fixture per runtime)
        run: RUNNER=venv DIST=dist tools/release_dry_run.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing requires this environment to exist on the repo and
    # to be selected on the PyPI publisher config.
    environment:
      name: pypi
      url: https://pypi.org/p/agentic-flink
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Select the distributions to upload
        run: |
          set -euo pipefail
          mkdir -p upload
          for name in $PUBLISH_DISTRIBUTIONS; do
            stem="${name//-/_}"
            cp dist/"$stem"-*.whl dist/"$stem"-*.tar.gz upload/
          done
          echo "uploading:"
          ls -l upload

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
          # print-hash: makes the publish log show the wheel SHA256, for
          # cross-checking against the PyPI page later.
          print-hash: true
