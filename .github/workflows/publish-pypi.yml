name: Publish Python package to PyPI

# Fires on every published GitHub Release.
# Uses PyPI Trusted Publishing (OIDC) — no API tokens stored in this repo.
# Configure the trusted publisher once on https://pypi.org/manage/account/publishing/
# (project: agentic-flink, owner: Ugbot, repo: Agentic-Streaming, workflow: publish-pypi.yml,
#  environment: pypi).
#
# NOTE: the repo was renamed Agentic-Flink -> Agentic-Streaming. PyPI matches the
# OIDC token's `repository` claim exactly, so the trusted publisher must be
# re-registered against Agentic-Streaming on pypi.org or this upload is rejected.
#
# The wheel bundles the shaded framework jar (python/setup.py copies target/agentic-flink-*-uber.jar
# into package data), so the Maven build runs first. The version published is the one the release
# tag names; the job fails when the tag and python/pyproject.toml disagree.

on:
  release:
    types: [published]
  # Manual fallback. Lets you re-publish without cutting a new GitHub Release
  # (e.g. if the upload step failed but the artifacts are fine). The tag must exist.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v1.0.0a2); must match python/pyproject.toml"
        required: true
        type: string

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag against pyproject version
        working-directory: python
        run: python tools/check_release_version.py "$RELEASE_TAG"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the canonical core
        run: ./mvnw -B -ntp -f ports/jagentic-core/pom.xml install -DskipTests

      - name: Build the shaded framework jar
        run: ./mvnw -B -ntp -DskipTests package

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        working-directory: python
        run: |
          python -m build
          unzip -l dist/*.whl | grep -E 'agentic_flink/jars/agentic-flink-.*-uber\.jar'

      - name: Check built artifacts carry the tagged version
        working-directory: python
        run: python tools/check_release_version.py "$RELEASE_TAG" dist/*

      - name: Run twine check
        working-directory: python
        run: python -m twine check dist/*

      - name: Smoke test the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install python/dist/*.whl
          mkdir -p /tmp/smoke && cp python/tests/smoke_clean_install.py /tmp/smoke/
          cd /tmp/smoke
          AGENTIC_SPEC_ROOT="$GITHUB_WORKSPACE/spec" /tmp/smoke-venv/bin/python smoke_clean_install.py \
            "$GITHUB_WORKSPACE/spec/conformance/v1/fixtures/01-routing-keyword.yaml"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing requires this environment to exist on the repo and
    # to be selected on the PyPI publisher config.
    environment:
      name: pypi
      url: https://pypi.org/p/agentic-flink
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # print-hash: makes the publish log show the wheel SHA256 — handy for
          # cross-checking against the PyPI page later.
          print-hash: true
