[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-flink"
version = "1.0.0a1"
description = "Python bindings for the Agentic Flink framework (JPype thread-mode bridge)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Agentic Flink contributors" }]
keywords = ["agentic", "flink", "llm", "rag", "jpype", "pyflink"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "JPype1>=1.5.0",
    "PyYAML>=6",
]

[project.optional-dependencies]
# Native PyFlink path targets the Flink 2.x line (matches the Java side's Flink 2.2).
pyflink = ["apache-flink>=2.0", "cloudpickle>=2"]
# The `flink` runtime (get_runtime("flink")) runs jobs in-process and needs the Flink
# distribution jars, which the shaded agentic-flink jar keeps out; the apache-flink wheel
# ships them under pyflink/lib.
flink = ["apache-flink>=2.0"]
test = ["pytest>=7", "jsonschema>=4"]
all = ["agentic-flink[pyflink,flink,test]"]

# Runtimes for the shared cross-runtime contract (`agentic.runtime.get_runtime(name)`).
[project.entry-points."agentic.runtimes"]
local-jvm = "agentic_flink.runtimes:local_jvm"
flink = "agentic_flink.runtimes:flink"
pekko = "agentic_flink.runtimes:pekko"

[project.urls]
Homepage = "https://github.com/Ugbot/Agentic-Streaming"
Repository = "https://github.com/Ugbot/Agentic-Streaming"
Issues = "https://github.com/Ugbot/Agentic-Streaming/issues"
Documentation = "https://github.com/Ugbot/Agentic-Streaming/blob/main/docs/python.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_flink*"]
exclude = ["tests*"]

# The shaded framework jar ships inside the wheel (copy target/agentic-flink-<v>-uber.jar to
# agentic_flink/jars/ before `python -m build`; see README "Jars" and agentic_flink/jars/README.md).
[tool.setuptools.package-data]
agentic_flink = ["jars/*.jar", "jars/README.md"]
