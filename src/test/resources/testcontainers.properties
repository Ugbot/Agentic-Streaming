# Podman's compat API does not implement the Docker checks Testcontainers runs at startup.
checks.disable=true
# Ryuk (the reaper side-car) cannot be turned off from this classpath file; rootless Podman setups
# without unqualified-search registries must export TESTCONTAINERS_RYUK_DISABLED=true. The tests
# stop their containers explicitly in @AfterAll regardless.
