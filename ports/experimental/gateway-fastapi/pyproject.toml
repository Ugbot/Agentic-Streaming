[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-gateway-fastapi"
version = "0.1.0"
description = "Experimental Agentic Streaming HTTP gateway: FastAPI front door over the pyagentic core with local, Celery and NATS backends"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pyagentic", "fastapi>=0.110", "pydantic>=2", "uvicorn>=0.27"]

[project.optional-dependencies]
celery = ["agentic-celery[celery]"]
nats = ["agentic-nats[nats]"]
test = ["pytest>=7", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/Ugbot/Agentic-Streaming"
Source = "https://github.com/Ugbot/Agentic-Streaming/tree/main/ports/experimental/gateway-fastapi"

[tool.setuptools.packages.find]
include = ["gateway_fastapi*"]

[tool.uv.sources]
pyagentic = { path = "../../pyagentic", editable = true }
agentic-celery = { path = "../celery", editable = true }
agentic-nats = { path = "../nats", editable = true }
