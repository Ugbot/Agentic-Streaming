[pytest]
# `pytest ports/experimental` from the repository root picks this up: the shared adapter
# tests plus the gateway's own HTTP tests. -rs prints the reason of every skipped test.
testpaths = tests gateway-fastapi/tests
addopts = -rs
markers =
    airflow: needs the agentic-airflow adapter and Airflow 3 (apache-airflow>=3)
    celery: needs the agentic-celery adapter and celery
    dask: needs the agentic-dask adapter (dask itself is optional: sequential fallback)
    faust: needs the agentic-faust adapter (faust itself only for the worker app)
    gateway: needs the agentic-gateway-fastapi adapter, fastapi and httpx
    nats: needs the agentic-nats adapter, nats-py and a reachable JetStream server
    ray: needs the agentic-ray adapter and ray
