[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-faust"
version = "0.1.0"
description = "Experimental Agentic Streaming adapter: a keyed Faust agent with Table-backed conversation state on the pyagentic core"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pyagentic"]

[project.optional-dependencies]
faust = ["faust-streaming>=0.10"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Ugbot/Agentic-Streaming"
Source = "https://github.com/Ugbot/Agentic-Streaming/tree/main/ports/experimental/faust"

[tool.setuptools.packages.find]
include = ["agentic_faust*"]

[tool.uv.sources]
pyagentic = { path = "../../pyagentic", editable = true }
