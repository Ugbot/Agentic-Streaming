[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-dask"
version = "0.1.0"
description = "Experimental Agentic Streaming adapter: batch RAG ingestion, retrieval eval and graph replay on Dask over the pyagentic core"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pyagentic"]

[project.optional-dependencies]
dask = ["dask[bag]>=2024.1"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Ugbot/Agentic-Streaming"
Source = "https://github.com/Ugbot/Agentic-Streaming/tree/main/ports/experimental/dask"

[tool.setuptools.packages.find]
include = ["agentic_dask*"]

[tool.uv.sources]
pyagentic = { path = "../../pyagentic", editable = true }
