[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ray"
version = "0.1.0"
description = "Experimental Agentic Streaming adapter: one Ray actor per conversation on the pyagentic core"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pyagentic"]

[project.optional-dependencies]
ray = ["ray>=2.9"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Ugbot/Agentic-Streaming"
Source = "https://github.com/Ugbot/Agentic-Streaming/tree/main/ports/experimental/ray"

[tool.setuptools.packages.find]
include = ["agentic_ray*"]

[tool.uv.sources]
pyagentic = { path = "../../pyagentic", editable = true }
