[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-celery"
version = "0.1.0"
description = "Experimental Agentic Streaming adapter: one conversational turn per Celery task on the pyagentic core"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pyagentic"]

[project.optional-dependencies]
celery = ["celery>=5.3"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Ugbot/Agentic-Streaming"
Source = "https://github.com/Ugbot/Agentic-Streaming/tree/main/ports/experimental/celery"

[tool.setuptools.packages.find]
include = ["agentic_celery*"]

[tool.uv.sources]
pyagentic = { path = "../../pyagentic", editable = true }
