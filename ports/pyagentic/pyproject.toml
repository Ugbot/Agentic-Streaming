[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyagentic"
version = "1.0.0"
description = "Agentic Streaming v1 in pure Python: one workflow IR, the `agentic` API surface, and the local reference runtime"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
    "PyYAML>=6.0,<7",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
# JVM-backed runtimes register themselves in the `agentic.runtimes` entry-point group.
flink = ["agentic-flink>=0.1,<1"]
pyflink = ["agentic-pyflink>=1.0.0a1,<2"]
jvm = ["agentic-flink>=0.1,<1"]
test = ["pytest>=7,<9"]
dev = ["pytest>=7,<9", "mypy>=1.8,<2", "ruff>=0.4,<1", "pip-tools>=7,<8"]

[project.entry-points."agentic.runtimes"]
local = "agentic.runtime:LocalRuntime"

# Consumed by spec/tools/conformance_matrix.py: fixture mapping in, normalized results (or {"skip": reason}) out.
[project.entry-points."agentic.conformance"]
pyagentic = "agentic.conformance:matrix_binding"

[tool.setuptools.packages.find]
include = ["agentic*", "pyagentic*"]

[tool.setuptools.package-data]
agentic = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
include = ["agentic/**/*.py", "tests/test_agentic_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["agentic"]

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
